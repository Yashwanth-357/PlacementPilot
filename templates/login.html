{% extends "base.html" %} {% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="sub-text">Login to continue your journey</p>
        <form method="POST">
            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            />
            <input 
                type="password" 
                name="password" 
                placeholder="Password" 
                required 
            />
            <button type="submit">Access Terminal</button>
        </form>
        <div class="auth-link">
            <a href="#">Forgot Password?</a>
        </div>
        <p class="switch-auth">
            Don't have an account? <a href="/signup">Initialize one</a>
        </p>
    </div>
</div>

{% endblock %}
