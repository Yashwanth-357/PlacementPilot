<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        {% include "style.css" %}
    </style>
    <!-- Add Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>PlacementPilot | AI Career Platform</title>
</head>
<body>
   <header>
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="logo" style="font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;">
            <span style="color: #00E5FF;">Placement</span><span style="color: #FF3DCE;">Pilot</span>
        </div>
        <nav>
            {% if session.get('user') %}
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
            <a href="/logout">Logout</a>
            {% else %}
            <a href="/login">Login</a>
            <a href="/signup" style="background: rgba(0, 229, 255, 0.1); border-color: rgba(0, 229, 255, 0.3); color: #00E5FF;">Sign up</a>
            {% endif %}
        </nav>
    </div>
   </header>
   <main class="container">
    {% block content %}{% endblock %}
   </main>
   <footer>
    <p>@2026 PlacementPilot • AI-Powered Career Guidance</p>
   </footer>
</body>
</html>
